name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/lanzador/go.mod
          cache-dependency-path: windows/lanzador/go.sum
      - name: Lanzador de Windows
        working-directory: windows/lanzador
        run: GOOS=windows GOARCH=amd64 go vet . && GOOS=windows GOARCH=amd64 go build -o /dev/null .
