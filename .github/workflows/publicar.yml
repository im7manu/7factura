# Publica una versión: al subir una etiqueta vX.Y.Z (igual a la versión de package.json) crea la Release
# con el paquete firmado. Las instalaciones la detectan en menos de una hora.
# Requiere el secreto FACTURADOR_CLAVE_FIRMA con la clave privada de firma (PEM).
name: Publicar versión
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then echo "La etiqueta ${GITHUB_REF_NAME} no coincide con package.json ($VERSION)"; exit 1; fi
      - run: npm run typecheck
      - run: npm test
      - name: Empaquetar y firmar
        env:
          FACTURADOR_CLAVE_FIRMA: ${{ secrets.FACTURADOR_CLAVE_FIRMA }}
        run: node scripts/crear-release.mjs
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "Facturador ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
